<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monaco + Luau LSP</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1e1e1e; }
  #editor { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="editor"></div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>

<script>
(function () {
  'use strict';

  const DOC_URI = 'file:///workspace/main.luau';
  const ROOT_URI = 'file:///workspace';

  let worker = null, ready = false, nextId = 1, docOpened = false, docVersion = 0;
  const pending = new Map();
  const notificationHandlers = {};

  function onNotification(method, handler) {
    (notificationHandlers[method] ||= []).push(handler);
  }

  function emitNotification(method, params) {
    for (const h of notificationHandlers[method] || []) h(params);
  }

  function decode(str) {
    const out = [];
    let pos = 0;
    while (pos < str.length) {
      const headerEnd = str.indexOf('\r\n\r\n', pos);
      if (headerEnd === -1) break;
      const m = str.slice(pos, headerEnd).match(/Content-Length:\s*(\d+)/i);
      if (!m) break;
      const bodyStart = headerEnd + 4;
      const bodyEnd = bodyStart + parseInt(m[1], 10);
      if (bodyEnd > str.length) break;
      try { out.push(JSON.parse(str.slice(bodyStart, bodyEnd))); } catch {}
      pos = bodyEnd;
    }
    return out;
  }

  const send = (obj) => worker.postMessage(JSON.stringify(obj));
  const notify = (method, params) => send({ jsonrpc: '2.0', method, params });

  function request(method, params) {
    return new Promise((resolve, reject) => {
      const id = nextId++;
      pending.set(id, { resolve, reject });
      send({ jsonrpc: '2.0', id, method, params });
    });
  }

  function handleMessage(m) {
    if (m.id !== undefined && pending.has(m.id)) {
      const { resolve, reject } = pending.get(m.id);
      pending.delete(m.id);
      m.error ? reject(m.error) : resolve(m.result);
      return;
    }
    if (m.id !== undefined && m.method) {
      send({ jsonrpc: '2.0', id: m.id, result: null });
      return;
    }
    if (m.method) emitNotification(m.method, m.params);
  }

  async function initialize() {
    const CDN = 'https://raw.githack.com/Zennokaidy/luau-lsp-template/main/web/public';
    const jsUrl = CDN + '/Luau.LanguageServer.Web.js';

    const [jsText, wasmBuffer] = await Promise.all([
      fetch(jsUrl).then(r => r.text()),
      fetch(CDN + '/Luau.LanguageServer.Web.wasm').then(r => r.arrayBuffer()),
    ]);

    let workerText = jsText
      .replace(/^\s*export\s+default\s+\w+\s*;?\s*$/gm, '')
      .replace(/^\s*export\s*\{[^}]*\}\s*;?\s*$/gm, '')
      .replace(/import\.meta\.url/g, JSON.stringify(jsUrl));

    workerText += '\n' + [
      'var wasmBinary = null, server = null, initDone = false, pendingMessages = [];',
      'function processOne(data) {',
      '  try { server.processInput(data); }',
      '  catch (e) { self.postMessage({ type: "error", msg: "processInput: " + e }); }',
      '}',
      'function initModule() {',
      '  LuauLanguageServerWeb({',
      '    wasmBinary: wasmBinary,',
      '    print: function(t) { self.postMessage({ type: "info", msg: t }); },',
      '    printErr: function(t) { self.postMessage({ type: "error", msg: t }); },',
      '    onAbort: function(r) { self.postMessage({ type: "error", msg: "abort: " + r }); },',
      '  }).then(function(M) {',
      '    var output = function(msg) { self.postMessage({ type: "output", msg: msg }); };',
      '    server = M.createWasmLanguageServer(output, "luau", [], []);',
      '    initDone = true;',
      '    for (var i = 0; i < pendingMessages.length; i++) processOne(pendingMessages[i]);',
      '    pendingMessages = [];',
      '  }).catch(function(e) {',
      '    self.postMessage({ type: "error", msg: "init rejected: " + e });',
      '  });',
      '}',
      'self.onmessage = function(e) {',
      '  if (e.data && e.data.type === "init-wasm") {',
      '    wasmBinary = new Uint8Array(e.data.wasmBuffer);',
      '    initModule();',
      '    return;',
      '  }',
      '  if (!initDone) { pendingMessages.push(e.data); return; }',
      '  processOne(e.data);',
      '};',
    ].join('\n');

    const blobUrl = URL.createObjectURL(new Blob([workerText], { type: 'application/javascript' }));
    worker = new Worker(blobUrl);
    URL.revokeObjectURL(blobUrl);

    worker.addEventListener('message', (e) => {
      if ((e.data || {}).type !== 'output') return;
      for (const m of decode(e.data.msg)) handleMessage(m);
    });

    worker.postMessage({ type: 'init-wasm', wasmBuffer }, [wasmBuffer]);

    const initResult = await request('initialize', {
      processId: null,
      rootUri: ROOT_URI,
      workspaceFolders: [{ uri: ROOT_URI, name: 'workspace' }],
      capabilities: {
        textDocument: {
          completion: {
            completionItem: {
              snippetSupport: true,
              documentationFormat: ['markdown', 'plaintext'],
              resolveSupport: { properties: ['documentation', 'detail'] },
            },
            contextSupport: true,
          },
          publishDiagnostics: { versionSupport: true },
        },
      },
    });

    notify('initialized', {});
    ready = true;
    return initResult;
  }

  function didOpen(text) {
    if (docOpened) return;
    docOpened = true;
    notify('textDocument/didOpen', {
      textDocument: { uri: DOC_URI, languageId: 'luau', version: 0, text },
    });
  }

  function didChange(text) {
    if (!ready) return;
    docVersion++;
    notify('textDocument/didChange', {
      textDocument: { uri: DOC_URI, version: docVersion },
      contentChanges: [{ text }],
    });
  }

  function completion(offset, model) {
    if (!ready || !docOpened) return Promise.resolve(null);
    const pos = model.getPositionAt(offset);
    return request('textDocument/completion', {
      textDocument: { uri: DOC_URI },
      position: { line: pos.lineNumber - 1, character: pos.column - 1 },
      context: { triggerKind: 1 },
    });
  }

  window.LuauLSP = {
    initialize, didOpen, didChange, completion, onNotification,
    isReady: () => ready && docOpened,
    DOC_URI,
  };
})();
</script>

<script>
const MONACO_BASE = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min';

const INITIAL_TEXT = `-- print("Hello World!")
`;

self.MonacoEnvironment = {
  getWorkerUrl: function () {
    const code =
      "self.MonacoEnvironment = { baseUrl: '" + MONACO_BASE + "/' };\n" +
      "importScripts('" + MONACO_BASE + "/vs/base/worker/workerMain.js');";
    return URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
  },
};

require.config({ paths: { vs: MONACO_BASE + '/vs' } });

require(['vs/editor/editor.main'], () => {

  monaco.languages.register({ id: 'luau' });

  monaco.languages.setMonarchTokensProvider('luau', {
    keywords: [
      'and','break','continue','do','else','elseif','end','for','function','if','in',
      'local','not','or','repeat','return','then','until','while','self','const',
      'export','type','typeof',
    ],
    constants: ['true', 'false', 'nil'],
    tokenizer: {
      root: [
        [/--\[\[/, 'comment', '@longComment'],
        [/--\[=+\[/, 'comment', '@longCommentEq'],
        [/--.*$/, 'comment'],
        [/\[\[/, 'string', '@longString'],
        [/\[=+\[/, 'string', '@longStringEq'],
        [/"([^"\\]|\\.)*"/, 'string'],
        [/'([^'\\]|\\.)*'/, 'string'],
        [/\b0[xX][0-9a-fA-F]+\b/, 'number.hex'],
        [/\b0[bB][01]+\b/, 'number.binary'],
        [/\b\d+(\.\d+)?([eE][+\-]?\d+)?\b/, 'number'],
        [/[a-zA-Z_]\w*/, {
          cases: { '@keywords': 'keyword', '@constants': 'constant', '@default': 'identifier' },
        }],
        [/[{}()\[\]]/, '@brackets'],
        [/\.\.\.|\.\.|==|~=|<=|>=|[+\-*\/%^#<>=~]=?/, 'operator'],
        [/[;,.]/, 'delimiter'],
      ],
      longComment:   [[/[^\]]+/, 'comment'], [/\]\]/, 'comment', '@pop'], [/\]/, 'comment']],
      longCommentEq: [[/[^\]]+/, 'comment'], [/\]=\+\]/, 'comment', '@pop'], [/\]/, 'comment']],
      longString:    [[/[^\]]+/, 'string'],  [/\]\]/,  'string',  '@pop'], [/\]/, 'string']],
      longStringEq:  [[/[^\]]+/, 'string'],  [/\]=\+\]/, 'string', '@pop'], [/\]/, 'string']],
    },
  });

  monaco.languages.setLanguageConfiguration('luau', {
    comments: { lineComment: '--', blockComment: ['--[[', ']]'] },
    brackets: [['{', '}'], ['[', ']'], ['(', ')']],
    autoClosingPairs: [
      { open: '{', close: '}' }, { open: '[', close: ']' }, { open: '(', close: ')' },
      { open: '"', close: '"' }, { open: "'", close: "'" },
    ],
    surroundingPairs: [
      { open: '{', close: '}' }, { open: '[', close: ']' }, { open: '(', close: ')' },
      { open: '"', close: '"' }, { open: "'", close: "'" },
    ],
  });

  const editor = monaco.editor.create(document.getElementById('editor'), {
    value: INITIAL_TEXT,
    language: 'luau',
    theme: 'vs-dark',
    automaticLayout: true,
    scrollBeyondLastLine: false,
    quickSuggestions: { other: true, comments: false, strings: false },
    wordBasedSuggestions: 'off',
    suggest: { maxVisibleSuggestions: 20 },
  });

  const model = editor.getModel();

  const KIND_MAP = {
    2: 'Method', 3: 'Function', 4: 'Constructor', 5: 'Field', 6: 'Variable',
    7: 'Class', 8: 'Interface', 9: 'Module', 10: 'Property', 11: 'Unit',
    12: 'Value', 13: 'Enum', 14: 'Keyword', 15: 'Snippet', 16: 'Color',
    17: 'File', 18: 'Reference', 19: 'Folder', 20: 'EnumMember', 21: 'Constant',
    22: 'Struct', 23: 'Event', 24: 'Operator', 25: 'TypeParameter',
  };

  function convertKind(k) {
    return monaco.languages.CompletionItemKind[KIND_MAP[k]] ?? monaco.languages.CompletionItemKind.Text;
  }

  function docToMonaco(doc) {
    if (!doc) return undefined;
    return typeof doc === 'string' ? doc : { value: doc.value || '' };
  }

  monaco.languages.registerCompletionItemProvider('luau', {
    triggerCharacters: ['.', ':'],
    provideCompletionItems: async function (model, position) {
      if (!window.LuauLSP?.isReady()) return { suggestions: [] };

      const offset = model.getOffsetAt(position);
      const word = model.getWordUntilPosition(position);
      const prefix = word.word || '';
      const lp = prefix.toLowerCase();
      const defaultRange = new monaco.Range(
        position.lineNumber, word.startColumn,
        position.lineNumber, word.endColumn
      );

      let result;
      try { result = await window.LuauLSP.completion(offset, model); }
      catch { return { suggestions: [] }; }
      if (!result) return { suggestions: [] };

      const items = Array.isArray(result) ? result : (result.items || []);
      const suggestions = [];

      for (const it of items) {
        const label = it.label || it.filterText || '';
        if (!label) continue;

        const ll = label.toLowerCase();
        let rank;
        if (!prefix) rank = 0;
        else if (label.startsWith(prefix)) rank = 0;
        else if (ll.startsWith(lp)) rank = 1;
        else if (ll.includes(lp)) rank = 2;
        else continue;

        let insertText = it.insertText || label;
        let range = defaultRange;

        if (it.textEdit) {
          const te = it.textEdit;
          const r = te.range || te.replace;
          if (r) {
            range = new monaco.Range(
              r.start.line + 1, r.start.character + 1,
              r.end.line + 1, r.end.character + 1
            );
          }
          insertText = te.newText !== undefined ? te.newText : te.replace;
        }

        suggestions.push({
          label,
          kind: convertKind(it.kind),
          detail: it.detail,
          documentation: docToMonaco(it.documentation),
          insertText,
          insertTextRules: it.insertTextFormat === 2
            ? monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet
            : undefined,
          range,
          filterText: prefix + label,
          sortText: String(rank).padStart(2, '0') + label,
        });
      }

      return { suggestions };
    },
  });

  window.LuauLSP.onNotification('textDocument/publishDiagnostics', (params) => {
    if (params.uri !== window.LuauLSP.DOC_URI) return;
    const SEV = {
      1: monaco.MarkerSeverity.Error, 2: monaco.MarkerSeverity.Warning,
      3: monaco.MarkerSeverity.Info,  4: monaco.MarkerSeverity.Hint,
    };
    const markers = (params.diagnostics || []).map(d => ({
      severity: SEV[d.severity] || monaco.MarkerSeverity.Error,
      message: d.message,
      startLineNumber: d.range.start.line + 1,
      startColumn: d.range.start.character + 1,
      endLineNumber: d.range.end.line + 1,
      endColumn: d.range.end.character + 1,
      source: d.source || 'luau-lsp',
    }));
    monaco.editor.setModelMarkers(model, 'luau-lsp', markers);
  });

  model.onDidChangeContent(() => {
    if (window.LuauLSP.isReady()) window.LuauLSP.didChange(model.getValue());
  });

  (async () => {
    try {
      await window.LuauLSP.initialize();
      window.LuauLSP.didOpen(model.getValue());
    } catch {}
  })();

  editor.focus();
});
</script>
</body>
</html>
