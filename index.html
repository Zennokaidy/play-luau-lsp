<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monaco Editor + Luau LSP</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #1e1e1e;
    color: #d4d4d4;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #monaco { flex: 1; min-height: 0; }
  .status-bar {
    background: #007acc;
    color: #fff;
    height: 22px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 12px;
    gap: 15px;
    flex: none;
  }
  .status-bar .right { margin-left: auto; }
</style>
</head>
<body>

<div id="monaco"></div>
<div class="status-bar">
  <span id="cursorPos">Ln 1, Col 1</span>
  <span>Spaces: 4</span>
  <span>UTF-8</span>
  <span>Luau</span>
  <div class="right"><span id="tsStatus">starting…</span></div>
</div>

<script>
(function () {
  let lspWorker = null;
  let lspReady = false;
  let nextId = 1;
  const pending = new Map();

  function encode(obj) { return JSON.stringify(obj); }

  function decode(str) {
    const out = [];
    let pos = 0;
    while (pos < str.length) {
      const headerEnd = str.indexOf('\r\n\r\n', pos);
      if (headerEnd === -1) break;
      const header = str.slice(pos, headerEnd);
      const m = header.match(/Content-Length:\s*(\d+)/i);
      if (!m) break;
      const len = parseInt(m[1], 10);
      const bodyStart = headerEnd + 4;
      const bodyEnd = bodyStart + len;
      if (bodyEnd > str.length) break;
      const body = str.slice(bodyStart, bodyEnd);
      try { out.push(JSON.parse(body)); }
      catch (e) { console.error('bad json', body); }
      pos = bodyEnd;
    }
    return out;
  }

  function send(obj) { lspWorker.postMessage(encode(obj)); }

  function request(method, params) {
    return new Promise((resolve, reject) => {
      const id = nextId++;
      pending.set(id, { resolve, reject });
      send({ jsonrpc: '2.0', id, method, params });
    });
  }

  function notify(method, params) {
    send({ jsonrpc: '2.0', method, params });
  }

  const DOC_URI = 'file:///workspace/main.luau';
  const ROOT_URI = 'file:///workspace';
  let docOpened = false;
  let docVersion = 0;
  let configLoaded = false;

  const LSP_CDN = 'https://raw.githack.com/Zennokaidy/luau-lsp-template/main/web/public';

  function initialize() {
    return Promise.all([
      fetch(LSP_CDN + '/Luau.LanguageServer.Web.js').then(r => {
        if (!r.ok) throw new Error('js ' + r.status);
        return r.text();
      }),
      fetch(LSP_CDN + '/Luau.LanguageServer.Web.wasm').then(r => {
        if (!r.ok) throw new Error('wasm ' + r.status);
        return r.arrayBuffer();
      })
    ])
      .then(results => {
        const rawText    = results[0];
        const wasmBuffer = results[1];
        const jsUrl = LSP_CDN + '/Luau.LanguageServer.Web.js';

        let workerScriptText = rawText
          .replace(/^\s*export\s+default\s+\w+\s*;?\s*$/gm, '')
          .replace(/^\s*export\s*\{[^}]*\}\s*;?\s*$/gm, '')
          .replace(/import\.meta\.url/g, JSON.stringify(jsUrl));

        workerScriptText += '\n' + [
          'var wasmBinary = null;',
          'var Module = null;',
          'var server = null;',
          'var initDone = false;',
          'var pendingMessages = [];',
          '',
          'function initModule() {',
          '  try {',
          '    LuauLanguageServerWeb({',
          '      wasmBinary: wasmBinary,',
          '      print: function(t) { self.postMessage({ type: "info", msg: t }); },',
          '      printErr: function(t) { self.postMessage({ type: "error", msg: t }); },',
          '      onAbort: function(r) { self.postMessage({ type: "error", msg: "abort " + r }); }',
          '    }).then(function(M) {',
          '      Module = M;',
          '      var outputFn = function(msg) { self.postMessage({ type: "output", msg: msg }); };',
          '      server = M.createWasmLanguageServer(outputFn, "luau", [], []);',
          '      initDone = true;',
          '      for (var i = 0; i < pendingMessages.length; i++) { processOne(pendingMessages[i]); }',
          '      pendingMessages = [];',
          '      self.postMessage({ type: "info", msg: "server criado" });',
          '    }).catch(function(err) {',
          '      self.postMessage({ type: "error", msg: "Promise rejeitada: " + err });',
          '    });',
          '  } catch (e) {',
          '    self.postMessage({ type: "error", msg: "factory: " + e.message });',
          '  }',
          '}',
          '',
          'function processOne(data) {',
          '  try { server.processInput(data); }',
          '  catch (err) { self.postMessage({ type: "error", msg: "processInput: " + err }); }',
          '}',
          '',
          'self.onmessage = function(e) {',
          '  if (e.data && e.data.type === "init-wasm") {',
          '    wasmBinary = new Uint8Array(e.data.wasmBuffer);',
          '    initModule();',
          '    return;',
          '  }',
          '  if (!initDone) { pendingMessages.push(e.data); return; }',
          '  processOne(e.data);',
          '};',
        ].join('\n') + '\n';

        const blob = new Blob([workerScriptText], { type: 'application/javascript' });
        const blobUrl = URL.createObjectURL(blob);
        lspWorker = new Worker(blobUrl);
        URL.revokeObjectURL(blobUrl);

        lspWorker.addEventListener('message', function (e) {
          const d = e.data || {};
          if (d.type === 'info') { console.log('[LSP]', d.msg); return; }
          if (d.type === 'error') { console.error('[LSP error]', d.msg); return; }
          if (d.type !== 'output') return;

          for (const m of decode(d.msg)) {
            if (m.id !== undefined && pending.has(m.id)) {
              const { resolve, reject } = pending.get(m.id);
              pending.delete(m.id);
              m.error ? reject(m.error) : resolve(m.result);
            } else if (m.method === 'workspace/configuration' && m.id !== undefined) {
              const items = (m.params && m.params.items) || [];
              const result = items.map(() => ({}));
              send({ jsonrpc: '2.0', id: m.id, result });
            } else if (m.method && m.id !== undefined) {
              send({ jsonrpc: '2.0', id: m.id, result: null });
            } else if (m.method === 'window/logMessage') {
              console.log('[LSP]', m.params.message);
              if (m.params.message && m.params.message.indexOf('loaded configuration') !== -1 && !configLoaded) {
                configLoaded = true;
                if (docOpened && lspReady && window.__monacoModel) {
                  const txt = window.__monacoModel.getValue();
                  notify('textDocument/didClose', { textDocument: { uri: DOC_URI } });
                  docOpened = false;
                  docVersion = 0;
                  setTimeout(() => {
                    notify('textDocument/didOpen', {
                      textDocument: { uri: DOC_URI, languageId: 'luau', version: 0, text: txt }
                    });
                    docOpened = true;
                  }, 300);
                }
              }
            }
          }
        });

        lspWorker.postMessage({
          type: 'init-wasm',
          wasmBuffer: wasmBuffer
        }, [wasmBuffer]);

        return request('initialize', {
          processId: null,
          rootUri: ROOT_URI,
          workspaceFolders: [{ uri: ROOT_URI, name: 'workspace' }],
          capabilities: {
            workspace: {
              configuration: true,
              didChangeConfiguration: { dynamicRegistration: false },
              workspaceFolders: true
            },
            textDocument: {
              completion: {
                completionItem: {
                  snippetSupport: false,
                  documentationFormat: ['markdown', 'plaintext'],
                  resolveSupport: { properties: ['documentation', 'detail'] }
                },
                contextSupport: true
              },
              hover: { contentFormat: ['markdown', 'plaintext'] },
              synchronization: { dynamicRegistration: false },
              publishDiagnostics: {}
            }
          },
          initializationOptions: null
        });
      })
      .then(initRes => {
        notify('initialized', {});
        lspReady = true;
        console.log('[LSP] initialized');
        return initRes;
      });
  }

  function didOpen(text) {
    if (docOpened) return;
    docOpened = true;
    docVersion = 0;
    notify('textDocument/didOpen', {
      textDocument: { uri: DOC_URI, languageId: 'luau', version: 0, text }
    });
  }

  function didChange(text) {
    if (!lspReady) return;
    if (!docOpened) { didOpen(text); return; }
    docVersion++;
    notify('textDocument/didChange', {
      textDocument: { uri: DOC_URI, version: docVersion },
      contentChanges: [{ text }]
    });
  }

  function completion(position) {
    return request('textDocument/completion', {
      textDocument: { uri: DOC_URI },
      position: { line: position.lineNumber - 1, character: position.column - 1 },
      context: { triggerKind: 1 }
    });
  }

  function hover(position) {
    return request('textDocument/hover', {
      textDocument: { uri: DOC_URI },
      position: { line: position.lineNumber - 1, character: position.column - 1 }
    });
  }

  window.LuauLSP = {
    initialize,
    didOpen,
    didChange,
    completion,
    hover,
    isReady: () => lspReady && docOpened
  };
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>

<script>
'use strict';

const MONACO_BASE = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min';

const INITIAL_TEXT = `local msg = "Hello World!"

print(msg)

local function soma(a, b)
    return a + b
end

print(soma(1, 2))
`;

let editor = null;
let monacoModel = null;
let lspInitPromise = null;

function defineTheme() {
  monaco.editor.defineTheme('luau-dark', {
    base: 'vs-dark',
    inherit: true,
    rules: [],
    colors: {
      'editor.background': '#1e1e1e'
    }
  });
}

function registerLuau() {
  monaco.languages.register({ id: 'luau' });

  const KIND_MAP = {
    2: monaco.languages.CompletionItemKind.Method,
    3: monaco.languages.CompletionItemKind.Function,
    4: monaco.languages.CompletionItemKind.Constructor,
    5: monaco.languages.CompletionItemKind.Field,
    6: monaco.languages.CompletionItemKind.Variable,
    7: monaco.languages.CompletionItemKind.Class,
    8: monaco.languages.CompletionItemKind.Interface,
    9: monaco.languages.CompletionItemKind.Module,
    10: monaco.languages.CompletionItemKind.Property,
    11: monaco.languages.CompletionItemKind.Unit,
    12: monaco.languages.CompletionItemKind.Value,
    13: monaco.languages.CompletionItemKind.Enum,
    14: monaco.languages.CompletionItemKind.Keyword,
    15: monaco.languages.CompletionItemKind.Snippet,
    16: monaco.languages.CompletionItemKind.Color,
    17: monaco.languages.CompletionItemKind.File,
    18: monaco.languages.CompletionItemKind.Reference,
    19: monaco.languages.CompletionItemKind.Folder,
    20: monaco.languages.CompletionItemKind.EnumMember,
    21: monaco.languages.CompletionItemKind.Constant,
    22: monaco.languages.CompletionItemKind.Struct,
    23: monaco.languages.CompletionItemKind.Event,
    24: monaco.languages.CompletionItemKind.Operator,
    25: monaco.languages.CompletionItemKind.TypeParameter
  };

  monaco.languages.setMonarchTokensProvider('luau', {
    defaultToken: '',
    tokenPostfix: '.luau',
    keywords: [
      'and', 'break', 'continue', 'do', 'else', 'elseif', 'end',
      'for', 'function', 'if', 'in', 'local', 'not', 'or',
      'repeat', 'return', 'then', 'until', 'while', 'self', 'export', 'type'
    ],
    constants: ['true', 'false', 'nil'],
    builtins: [
      'print', 'warn', 'error', 'assert', 'type', 'typeof', 'tostring', 'tonumber',
      'pairs', 'ipairs', 'next', 'select', 'pcall', 'xpcall',
      'setmetatable', 'getmetatable', 'rawget', 'rawset', 'require', 'newproxy'
    ],
    tokenizer: {
      root: [
        [/--\[\[/, 'comment', '@comment'],
        [/--.*$/, 'comment'],
        [/\[\[/, 'string', '@string_long'],
        [/"([^"\\]|\\.)*"/, 'string'],
        [/'([^'\\]|\\.)*'/, 'string'],
        [/\d+(\.\d+)?/, 'number'],
        [/[a-zA-Z_]\w*/, {
          cases: {
            '@keywords': 'keyword',
            '@constants': 'constant',
            '@builtins': 'type.identifier',
            '@default': 'identifier'
          }
        }],
        [/[{}()\[\]]/, '@brackets'],
        [/[=+\-*\/%^#<>~]/, 'operator']
      ],
      comment: [
        [/[^\]]+/, 'comment'],
        [/\]\]/, 'comment', '@pop']
      ],
      string_long: [
        [/[^\]]+/, 'string'],
        [/\]\]/, 'string', '@pop']
      ]
    }
  });

  monaco.languages.setLanguageConfiguration('luau', {
    comments: { lineComment: '--' },
    brackets: [['{', '}'], ['[', ']'], ['(', ')']],
    autoClosingPairs: [
      { open: '{', close: '}' },
      { open: '[', close: ']' },
      { open: '(', close: ')' },
      { open: '"', close: '"' },
      { open: "'", close: "'" }
    ],
    surroundingPairs: [
      { open: '{', close: '}' },
      { open: '[', close: ']' },
      { open: '(', close: ')' },
      { open: '"', close: '"' },
      { open: "'", close: "'" }
    ]
  });

  monaco.languages.registerCompletionItemProvider('luau', {
    triggerCharacters: ['.', ':', '"', "'"],
    provideCompletionItems: async function (model, position) {
      if (!window.LuauLSP || !window.LuauLSP.isReady()) return { suggestions: [] };

      const result = await window.LuauLSP.completion(position);
      if (!result) return { suggestions: [] };

      const list = Array.isArray(result) ? result : (result.items || []);
      if (!list.length) return { suggestions: [] };

      const word = model.getWordUntilPosition(position);
      const range = {
        startLineNumber: position.lineNumber,
        endLineNumber: position.lineNumber,
        startColumn: word.startColumn,
        endColumn: word.endColumn
      };

      const suggestions = list.map(function (item) {
        const kind = KIND_MAP[item.kind] || monaco.languages.CompletionItemKind.Text;
        const documentation = item.documentation
          ? (typeof item.documentation === 'string'
              ? { value: item.documentation }
              : { value: item.documentation.value || '' })
          : undefined;

        return {
          label: item.label,
          kind: kind,
          detail: item.detail,
          documentation: documentation,
          insertText: item.insertText || item.label,
          filterText: item.label,
          range: range,
          sortText: item.sortText
        };
      });

      return { suggestions: suggestions };
    }
  });

  monaco.languages.registerHoverProvider('luau', {
    provideHover: async function (model, position) {
      if (!window.LuauLSP || !window.LuauLSP.isReady()) return null;
      const result = await window.LuauLSP.hover(position);
      if (!result || !result.contents) return null;

      let value = '';
      if (Array.isArray(result.contents)) {
        value = result.contents.map(c => typeof c === 'string' ? c : (c.value || '')).join('\n\n');
      } else if (typeof result.contents === 'string') {
        value = result.contents;
      } else {
        value = result.contents.value || '';
      }

      return {
        contents: [{ value: value }],
        range: result.range ? new monaco.Range(
          result.range.start.line + 1,
          result.range.start.character + 1,
          result.range.end.line + 1,
          result.range.end.character + 1
        ) : undefined
      };
    }
  });
}

async function initMonaco() {
  await new Promise(function (resolve, reject) {
    if (typeof window.require !== 'function') {
      reject(new Error('Monaco loader not available'));
      return;
    }
    const workerCode =
      "self.MonacoEnvironment = { baseUrl: '" + MONACO_BASE + "/' };\n" +
      "importScripts('" + MONACO_BASE + "/vs/base/worker/workerMain.js');";
    const workerUrl = URL.createObjectURL(new Blob([workerCode], { type: 'text/javascript' }));
    window.MonacoEnvironment = { getWorkerUrl: function () { return workerUrl; } };
    window.require.config({ paths: { vs: MONACO_BASE + '/vs' } });
    window.require(['vs/editor/editor.main'], resolve, reject);
  });

  defineTheme();
  registerLuau();

  editor = monaco.editor.create(document.getElementById('monaco'), {
    value: INITIAL_TEXT,
    language: 'luau',
    theme: 'luau-dark',
    fontFamily: "'Fira Mono', Consolas, 'Courier New', monospace",
    fontSize: 14,
    lineHeight: 21,
    tabSize: 4,
    insertSpaces: true,
    automaticLayout: true,
    minimap: { enabled: false },
    scrollBeyondLastLine: false,
    smoothScrolling: false,
    renderLineHighlight: 'all',
    padding: { top: 10, bottom: 10 },
    lineNumbersMinChars: 3,
    glyphMargin: false,
    folding: true,
    showFoldingControls: 'mouseover',
    bracketPairColorization: { enabled: true },
    matchBrackets: 'always',
    guides: { indentation: true, bracketPairs: true },
    wordWrap: 'off',
    quickSuggestions: { other: true, comments: false, strings: false },
    suggestOnTriggerCharacters: true,
    acceptSuggestionOnEnter: 'on',
    tabCompletion: 'on',
    suggest: {
      showWords: true,
      preview: true,
      filterGraceful: true,
      localityBonus: false
    },
    scrollbar: {
      verticalScrollbarSize: 14,
      horizontalScrollbarSize: 14,
      useShadows: false
    }
  });

  monacoModel = editor.getModel();
  window.__monacoModel = monacoModel;

  const cursorPosEl = document.getElementById('cursorPos');
  editor.onDidChangeCursorPosition(function (e) {
    cursorPosEl.textContent = 'Ln ' + e.position.lineNumber + ', Col ' + e.position.column;
  });

  monacoModel.onDidChangeContent(function () {
    if (window.LuauLSP && window.LuauLSP.isReady()) {
      window.LuauLSP.didChange(monacoModel.getValue());
    }
  });

  document.getElementById('tsStatus').textContent = 'starting LSP…';

  lspInitPromise = window.LuauLSP.initialize().then(function () {
    window.LuauLSP.didOpen(monacoModel.getValue());
    document.getElementById('tsStatus').textContent = 'LSP ready';
  }).catch(function (e) {
    console.error('[LSP init]', e);
    document.getElementById('tsStatus').textContent = 'LSP failed';
  });
}

initMonaco().catch(function (err) {
  console.error('[Monaco]', err);
});
</script>

</body>
</html>
